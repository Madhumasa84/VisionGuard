[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "visionguard-lite"
version = "0.2.0"
description = "CPU-First Uncertainty-Aware Pose Fall Detection & Calibration"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "VisionGuard Research Team"}
]
keywords = [
    "computer-vision",
    "fall-detection",
    "pose-estimation",
    "edge-ai",
    "onnx-runtime",
    "calibration",
    "mediapipe"
]
dependencies = [
    "torch>=2.1.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.3.0",
    "opencv-python-headless>=4.8.0",
    "matplotlib>=3.7.0",
    "gradio>=4.0.0",
    "mediapipe>=0.10.0",
    "onnx>=1.14.0",
    "onnxruntime>=1.15.0",
    "psutil>=5.9.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0"
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]
python_files = [
    "test_*.py"
]
