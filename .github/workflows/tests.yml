name: VisionGuard Lite CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgles2 libegl1 libgl1 libglib2.0-0 ffmpeg
          python -m pip install --upgrade pip
          pip install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-local.txt
          pip install pytest pytest-cov
          pip install -e . --no-deps

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-local.txt
          pip install pytest pytest-cov
          pip install -e . --no-deps

      - name: Run Unit & Integration Tests
        env:
          PYTHONPATH: .
        run: |
          python -m pytest tests/ -v

      - name: Run Integration Pipeline Smoke Test
        env:
          PYTHONPATH: .
        run: |
          python -c "from demo.app import process_video_pipeline; res = process_video_pipeline('demo/sample_activity.mp4'); print(res[3]); assert res[0] is not None"
